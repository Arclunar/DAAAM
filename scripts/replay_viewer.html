<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DAAAM 建图回看</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Template of scripts/replay.py: `build` puts the recorded scene graph snapshots in place of the marker below.
     Plain WebGL, no libraries, no network access. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171b; color: #dfe3ea; font: 13px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #selection-overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; padding: 1px 5px; border-radius: 3px; background: rgba(10, 12, 16, .74); color: #fff; max-width: 340px; overflow: hidden; text-overflow: ellipsis; will-change: transform; }
  .lab.selected { z-index: 2; background: rgba(10, 12, 16, .92); box-shadow: 0 0 0 2px #ffb000; }
  #panel { position: absolute; left: 12px; top: 12px; background: rgba(20, 23, 28, .88); border: 1px solid #2b313b; border-radius: 8px; padding: 10px 12px; width: 200px; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; }
  #panel .sub { color: #8b94a3; font-size: 12px; margin-bottom: 8px; word-break: break-all; }
  #panel label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; user-select: none; }
  #panel .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #panel .row input[type=range] { flex: 1; min-width: 0; }
  #panel select { flex: 1; min-width: 0; background: #252a32; color: #dfe3ea; border: 1px solid #3a4250; border-radius: 4px; padding: 2px 4px; }
  #panel .help { margin-top: 8px; color: #8b94a3; font-size: 12px; }
  #panel .hint { margin-top: 4px; color: #8b94a3; font-size: 11px; line-height: 1.35; }
  #entity-browser { position: absolute; right: 12px; top: 12px; bottom: 72px; width: 340px; display: flex; flex-direction: column; background: rgba(20, 23, 28, .94); border: 1px solid #2b313b; border-radius: 8px; overflow: hidden; }
  .entity-head { padding: 10px 10px 8px; border-bottom: 1px solid #2b313b; }
  .entity-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .entity-title b { font-size: 14px; }
  .entity-title span { color: #8b94a3; font-size: 11px; }
  .entity-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .entity-tabs button { background: #252a32; color: #9da6b4; border: 1px solid #353c48; border-radius: 5px; padding: 5px 7px; cursor: pointer; }
  .entity-tabs button.active { background: #34445c; border-color: #5983bb; color: #fff; }
  #entity-filter { width: 100%; box-sizing: border-box; margin-top: 7px; padding: 5px 7px; background: #171a20; color: #dfe3ea; border: 1px solid #353c48; border-radius: 5px; }
  #entity-list { flex: 1 1 auto; min-height: 100px; overflow-y: auto; padding: 5px; }
  .entity-empty { padding: 18px 10px; color: #8b94a3; text-align: center; }
  .entity-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto auto; gap: 5px; align-items: center; padding: 6px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
  .entity-row:hover { background: #252a32; }
  .entity-row.active { background: #2c3c52; border-color: #5983bb; }
  .entity-row.absent { opacity: .55; }
  .entity-row.hidden { opacity: .38; }
  .entity-dot { width: 9px; height: 9px; margin: auto; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.08); }
  .entity-copy { min-width: 0; }
  .entity-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #edf1f7; }
  .entity-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8b94a3; font-size: 11px; }
  .entity-eye, .entity-source { height: 26px; padding: 0 6px; color: #dfe3ea; background: transparent; border: 0; border-radius: 4px; cursor: pointer; }
  .entity-eye { width: 30px; padding: 0; font-size: 15px; }
  .entity-source { font-size: 11px; color: #bcd5f6; }
  .entity-eye:hover, .entity-source:hover:not(:disabled) { background: #3a4250; }
  .entity-source:disabled { color: #606978; cursor: default; }
  #entity-detail { flex: 0 0 auto; max-height: 34%; overflow-y: auto; border-top: 1px solid #2b313b; padding: 9px 11px 11px; white-space: pre-line; }
  #entity-detail .detail-title { font-size: 14px; font-weight: 600; }
  #entity-detail .detail-description { margin-top: 5px; color: #f1f4f8; }
  #entity-detail .detail-meta { margin-top: 6px; color: #9aa4b3; font-size: 12px; }
  #description-source-modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 28px; background: rgba(5, 7, 10, .82); }
  #description-source-modal.open { display: flex; }
  .source-modal-card { position: relative; max-width: min(90vw, 960px); max-height: 90vh; padding: 10px; background: #1d2128; border: 1px solid #465064; border-radius: 9px; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
  #description-source-caption { margin: 0 36px 8px 2px; color: #dfe3ea; }
  #description-source-image { display: block; max-width: 86vw; max-height: 80vh; border-radius: 5px; image-rendering: auto; }
  #description-source-close { position: absolute; right: 8px; top: 6px; width: 28px; height: 28px; color: #dfe3ea; background: #2b313b; border: 1px solid #465064; border-radius: 5px; cursor: pointer; font-size: 18px; }
  #cam { position: absolute; right: 366px; bottom: 72px; display: none; gap: 8px; align-items: flex-end; }
  #cam .shot { background: rgba(20, 23, 28, .92); border: 1px solid #2b313b; border-radius: 8px; padding: 6px; }
  #cam .cap { font-size: 12px; color: #8b94a3; margin-bottom: 4px; }
  #cam img { display: block; width: 240px; border-radius: 4px; cursor: zoom-in; }
  #cam.big img { width: 480px; cursor: zoom-out; }
  #bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; background: rgba(20, 23, 28, .9); border: 1px solid #2b313b; border-radius: 8px; padding: 8px 12px; }
  #bar button, #bar select { background: #2b313b; color: #dfe3ea; border: 1px solid #3a4250; border-radius: 5px; padding: 4px 10px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #38404d; }
  #slider { flex: 1; min-width: 100px; }
  #info { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 2em; font-size: 15px; }
  @media (max-width: 900px) {
    #entity-browser { width: 280px; }
    #cam { right: 302px; }
    #cam img { width: 180px; }
  }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<canvas id="selection-overlay"></canvas>
<div id="labels"></div>
<div id="panel">
  <h1>DAAAM 建图回看</h1>
  <div class="sub" id="title"></div>
  <div class="row"><span>网格</span><select id="mesh-mode">
    <option value="reference">1 cm 参考网格</option>
    <option value="dynamic">动态 Hydra 网格</option>
    <option value="none">隐藏网格</option>
  </select></div>
  <div id="mesh-status" class="hint"></div>
  <label><input type="checkbox" id="c-bright" checked> 提亮网格颜色(场景偏暗)</label>
  <label><input type="checkbox" id="c-points"> 只画顶点</label>
  <label><input type="checkbox" id="c-obj" checked> 物体节点</label>
  <div class="row"><span>物体框</span><select id="bbox-mode"><option value="selected" selected>仅选中</option><option value="all">全部</option><option value="none">隐藏</option></select></div>
  <div class="row"><span>标签</span><select id="label-mode" title="漂浮的描述卡片:全部模式下卡片可以互相重叠,但不会因为相机移动而时隐时现"><option value="selected" selected>仅选中</option><option value="all">全部</option><option value="none">隐藏</option></select></div>
  <label><input type="checkbox" id="c-places" checked> 地点</label>
  <label><input type="checkbox" id="c-pedges" checked> 地点连线</label>
  <label><input type="checkbox" id="c-rooms" checked> 房间 / 楼宇</label>
  <label><input type="checkbox" id="c-links"> 层间连线</label>
  <label><input type="checkbox" id="c-traj" checked> 相机轨迹</label>
  <label><input type="checkbox" id="c-cam" checked> 相机画面(RGB / 深度)</label>
  <div class="row"><span>节点大小</span><input type="range" id="r-size" min="0.4" max="3" step="0.1" value="1"></div>
  <div class="row"><span>层间距</span><input type="range" id="r-space" min="0" max="3" step="0.1" value="1"><span id="v-space">1.0 m</span></div>
  <div class="help">左键旋转 · 右键或 Shift+左键平移<br>滚轮缩放 · 双击复位<br>点击物体框内或右侧列表:选择实体<br>空格 播放/暂停 · ←/→ 单步</div>
</div>
<aside id="entity-browser">
  <div class="entity-head">
    <div class="entity-title"><b>场景实体</b><span id="entity-count"></span></div>
    <div class="entity-tabs">
      <button id="entity-tab-objects" class="active" type="button">物体</button>
      <button id="entity-tab-places" type="button">地点</button>
    </div>
    <input id="entity-filter" type="search" placeholder="筛选编号或描述" autocomplete="off">
  </div>
  <div id="entity-list"></div>
  <div id="entity-detail"><span class="entity-empty">选择一个物体或地点查看详情</span></div>
</aside>
<div id="description-source-modal" role="dialog" aria-modal="true" aria-label="DAM 描述来源图像">
  <div class="source-modal-card">
    <button id="description-source-close" type="button" title="关闭">×</button>
    <div id="description-source-caption"></div>
    <img id="description-source-image" alt="DAM 描述来源帧">
  </div>
</div>
<div id="cam">
  <div class="shot"><div class="cap" id="cap-rgb"></div><img id="img-rgb" alt="RGB" title="点击放大 / 缩小"></div>
  <div class="shot"><div class="cap" id="cap-depth"></div><img id="img-depth" alt="深度" title="点击放大 / 缩小"></div>
</div>
<div id="bar">
  <button id="first" title="回到开头 (Home)">⏮</button>
  <button id="prev" title="上一帧 (←)">◀</button>
  <button id="play" title="播放 / 暂停 (空格)" style="min-width:44px">▶</button>
  <button id="next" title="下一帧 (→)">▶▏</button>
  <input type="range" id="slider" min="0" value="0" step="1">
  <select id="speed" title="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <span id="info">加载中…</span>
</div>
<div id="msg"></div>
<!--REPLAY_DATA-->
<script>
(() => {
'use strict';
const D = window.REPLAY;
const $ = (id) => document.getElementById(id);
const fail = (text) => { const m = $('msg'); m.textContent = text; m.style.display = 'flex'; };
if (!D || !D.chunks || !D.chunks.length) { fail('没有数据:这个页面需要由 scripts/replay.py build 生成。'); return; }
if (typeof DecompressionStream === 'undefined') { fail('浏览器太旧:需要支持 DecompressionStream(Chrome / Edge 80+、Firefox 113+、Safari 16.4+)。'); return; }
const canvas = $('gl');
const gl = canvas.getContext('webgl', { antialias: true });
if (!gl) { fail('浏览器不支持 WebGL。'); return; }
const UINT_INDEX_OK = !!gl.getExtension('OES_element_index_uint');   // 32-bit indices: meshes with more than 65,535 vertices
$('title').textContent = D.title || '';
if (!D.frames) $('c-cam').parentElement.style.display = 'none';   // built without --dataset: no camera images

// ------------------------------------------------------------------ data
const N = D.snapshots.length;
const TYPES = { f4: Float32Array, i4: Int32Array, u4: Uint32Array, i2: Int16Array, u2: Uint16Array, u1: Uint8Array };
const cache = new Map();   // snapshot number -> Promise of the decoded snapshot

async function inflate(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Response(stream).arrayBuffer();
}

function unpack(buf) {   // layout written by pack() in replay.py
  const headLen = new DataView(buf).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headLen)));
  const base = 4 + headLen, out = {};
  for (const h of header) out[h.n] = new TYPES[h.t](buf, base + h.o, h.s.reduce((a, b) => a * b, 1));
  return out;
}

function vertexNormals(pos, idx) {
  const n = new Float32Array(pos.length);
  for (let t = 0; t < idx.length; t += 3) {
    const a = idx[t] * 3, b = idx[t + 1] * 3, c = idx[t + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    n[a] += nx; n[a + 1] += ny; n[a + 2] += nz;
    n[b] += nx; n[b + 1] += ny; n[b + 2] += nz;
    n[c] += nx; n[c + 1] += ny; n[c + 2] += nz;
  }
  for (let i = 0; i < n.length; i += 3) {
    const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1;
    n[i] /= l; n[i + 1] /= l; n[i + 2] /= l;
  }
  return n;
}

async function decode(i) {
  const a = unpack(await inflate(D.chunks[i]));
  const q = D.quant, nv = a.mesh_pos.length / 3, pos = new Float32Array(nv * 3);
  for (let k = 0; k < nv; k++) {
    pos[3 * k] = q.min[0] + (a.mesh_pos[3 * k] + 32768) * q.scale[0];
    pos[3 * k + 1] = q.min[1] + (a.mesh_pos[3 * k + 1] + 32768) * q.scale[1];
    pos[3 * k + 2] = q.min[2] + (a.mesh_pos[3 * k + 2] + 32768) * q.scale[2];
  }
  a.pos = pos;
  a.nrm = vertexNormals(pos, a.mesh_faces);
  return a;
}

function snapshot(i) {
  if (!cache.has(i)) {
    cache.set(i, decode(i));
    if (cache.size > 24) cache.delete(cache.keys().next().value);
  }
  return cache.get(i);
}

// The static 1 cm reference mesh (replay.py build --reference-mesh): one payload with its own quantization grid and int16
// normals, decoded once. It is a full-sequence RGB-D reconstruction, not what Hydra had at a given moment.
const REF = D.reference_mesh || null;
async function decodeReference() {
  const a = unpack(await inflate(REF.chunk));
  const rq = REF.quant, nv = a.mesh_pos.length / 3, pos = new Float32Array(nv * 3);
  for (let k = 0; k < nv; k++) {
    pos[3 * k] = rq.min[0] + (a.mesh_pos[3 * k] + 32768) * rq.scale[0];
    pos[3 * k + 1] = rq.min[1] + (a.mesh_pos[3 * k + 1] + 32768) * rq.scale[1];
    pos[3 * k + 2] = rq.min[2] + (a.mesh_pos[3 * k + 2] + 32768) * rq.scale[2];
  }
  let nrm;
  if (a.mesh_nrm) { nrm = new Float32Array(a.mesh_nrm.length); for (let k = 0; k < nrm.length; k++) nrm[k] = a.mesh_nrm[k] / 32767; }
  else nrm = vertexNormals(pos, a.mesh_faces);   // a payload without normals: compute them as for the dynamic mesh
  return { pos, nrm, col: a.mesh_col, idx: a.mesh_faces, count: nv, tris: a.mesh_faces.length / 3 };
}

// ------------------------------------------------------------------ math (column-major, as WebGL wants it)
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function lookAt(eye, c, up) {
  let zx = eye[0] - c[0], zy = eye[1] - c[1], zz = eye[2] - c[2], l = Math.hypot(zx, zy, zz);
  zx /= l; zy /= l; zz /= l;
  let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return { m: new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
    -(xx * eye[0] + xy * eye[1] + xz * eye[2]), -(yx * eye[0] + yy * eye[1] + yz * eye[2]), -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1]),
    right: [xx, xy, xz], up: [yx, yy, yz] };
}
function mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

// ------------------------------------------------------------------ shaders
function program(vs, fs, attribs, uniforms) {
  const make = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, make(gl.VERTEX_SHADER, vs)); gl.attachShader(p, make(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const out = { p, a: {}, u: {} };
  for (const a of attribs) out.a[a] = gl.getAttribLocation(p, a);
  for (const u of uniforms) out.u[u] = gl.getUniformLocation(p, u);
  return out;
}

const MESH = program(`
  attribute vec3 aPos; attribute vec3 aCol; attribute vec3 aNrm;
  uniform mat4 uMVP; uniform mat4 uView; uniform float uPoint;
  varying vec3 vCol; varying vec3 vNrm;
  void main() { vCol = aCol; vNrm = (uView * vec4(aNrm, 0.0)).xyz; gl_Position = uMVP * vec4(aPos, 1.0); gl_PointSize = uPoint; }`, `
  precision mediump float;
  varying vec3 vCol; varying vec3 vNrm; uniform float uLit; uniform float uGain;
  void main() { float l = mix(1.0, 0.55 + 0.45 * abs(normalize(vNrm).z), uLit); gl_FragColor = vec4(min(vCol * l * uGain, vec3(1.0)), 1.0); }`,
  ['aPos', 'aCol', 'aNrm'], ['uMVP', 'uView', 'uPoint', 'uLit', 'uGain']);

const NODES = program(`
  attribute vec3 aPos; attribute vec3 aCol; attribute float aSize;
  uniform mat4 uMVP; uniform float uScale;
  varying vec3 vCol;
  void main() { vCol = aCol; gl_Position = uMVP * vec4(aPos, 1.0);
    gl_PointSize = clamp(2.0 * aSize * uScale / max(gl_Position.w, 0.001), 3.0, 96.0); }`, `
  precision mediump float;
  varying vec3 vCol;
  void main() { vec2 p = gl_PointCoord * 2.0 - 1.0; float r2 = dot(p, p); if (r2 > 1.0) discard;
    gl_FragColor = vec4(vCol * (0.45 + 0.55 * sqrt(1.0 - r2)), 1.0); }`,
  ['aPos', 'aCol', 'aSize'], ['uMVP', 'uScale']);

const LINES = program(`
  attribute vec3 aPos; attribute vec3 aCol; uniform mat4 uMVP; varying vec3 vCol;
  void main() { vCol = aCol; gl_Position = uMVP * vec4(aPos, 1.0); }`, `
  precision mediump float; varying vec3 vCol;
  void main() { gl_FragColor = vec4(vCol, 1.0); }`,
  ['aPos', 'aCol'], ['uMVP']);

const B = {};   // GL buffers
for (const k of ['mPos', 'mCol', 'mNrm', 'mIdx', 'lPos', 'lCol', 'nPos', 'nCol', 'nSize', 'hNPos', 'hNCol', 'hNSize']) B[k] = gl.createBuffer();
// meshKey names the arrays in the mesh buffers ('reference', 'dynamic:<snapshot>' or 'none'); meshUploads counts the uploads
const G = { meshCount: 0, meshTriangles: 0, meshIndexed: 0, meshKey: 'none', meshUploads: 0, indexType: gl.UNSIGNED_SHORT, lines: 0, nodes: 0, highlightNodes: 0,
            overlay: { visible: false, segments: 0, corners: 0 } };

function upload(buffer, target, data) { gl.bindBuffer(target, buffer); gl.bufferData(target, data, gl.DYNAMIC_DRAW); }
function attrib(loc, buffer, size, type, normalized) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, type, !!normalized, 0, 0);
}

// ------------------------------------------------------------------ state and scene assembly
const S = { cur: -1, snap: null, reference: null, yaw: 0.8, pitch: 0.5, dist: 6, target: [0, 0, 0], dirty: true, wanted: 0, request: 0,
            selectedKey: null, hidden: new Set(), entityTab: 'objects', objItems: [], placeItems: [] };
const ui = (id) => $(id);
const q = D.quant;
let center = q.min.map((v, i) => v + 32767.5 * q.scale[i]);   // of the scene, refined by fitView()
let radius = Math.max(0.5, Math.hypot(...q.scale.map((s) => 65535 * s)) / 2);

function fitView() {   // frame everything the current snapshot shows, the lifted layers included
  const a = S.snap, sp = parseFloat(ui('r-space').value), lo = q.min.slice(), hi = q.min.map((v, i) => v + 65535 * q.scale[i]);
  const grow = (arr, lift) => { for (let i = 0; i < arr.length; i += 3) for (let k = 0; k < 3; k++) {
    const v = arr[i + k] + (k === 2 ? lift * sp : 0); if (v < lo[k]) lo[k] = v; if (v > hi[k]) hi[k] = v; } };
  if (REF && S.reference && ui('mesh-mode').value === 'reference')   // the reference mesh is on screen: its bounds count too
    for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], REF.quant.min[k]); hi[k] = Math.max(hi[k], REF.quant.min[k] + 65535 * REF.quant.scale[k]); }
  grow(a.place_pos, 1); grow(a.room_pos, 2); grow(a.bld_pos, 3); grow(a.agent_pos, 0); grow(a.obj_min, 0); grow(a.obj_max, 0);
  center = lo.map((v, i) => (v + hi[i]) / 2);
  radius = Math.max(0.5, Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2);
}
function resetView() { S.yaw = 0.8; S.pitch = 0.5; S.dist = radius * 2.0; S.target = center.slice(); requestDraw(); }

const AMBER = '#ffb000', AMBER_RGB = [1, 176 / 255, 0], HALO = 'rgba(8, 10, 14, 0.94)';   // the selection: vivid amber on a near-black halo

const hue = (label) => {   // distinct colour per semantic label
  const h = ((label * 0.61803398875) % 1) * 6, c = 0.75, x = c * (1 - Math.abs(h % 2 - 1)), m = 0.22;
  const rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h) % 6];
  return [rgb[0] + m, rgb[1] + m, rgb[2] + m];
};
const row = (a, i) => [a[3 * i], a[3 * i + 1], a[3 * i + 2]];
const BOX_EDGES = [[0, 1], [1, 3], [3, 2], [2, 0], [4, 5], [5, 7], [7, 6], [6, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
function quatAxes(qv) {
  const [w, x, y, z] = qv;
  return [[1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w)],
          [2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w)],
          [2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y)]];
}

// Floating cards. Which cards exist is decided only when the scene state changes (a new snapshot, the selection, an entity's
// eye, the label mode or a layer switch: assemble()); orbiting, panning and zooming only move the existing cards, so a card
// never appears or disappears because another one happens to cross it.
const labelEls = new Map();   // label key -> its element
let labelItems = [];   // { key, pos, text, color, selected } of the cards of this snapshot, the selected one last

function setLabelItems(items) {
  const host = $('labels'), keep = new Set(items.map((item) => item.key));
  for (const [key, el] of labelEls) if (!keep.has(key)) { el.remove(); labelEls.delete(key); }
  items.sort((a, b) => Number(a.selected) - Number(b.selected));   // the selected card is drawn last, above all others
  for (const item of items) {
    let el = labelEls.get(item.key);
    if (!el) { el = document.createElement('div'); el.className = 'lab'; el.dataset.labelKey = item.key; labelEls.set(item.key, el); }
    if (el.textContent !== item.text) el.textContent = item.text;
    el.style.borderLeft = '3px solid rgb(' + item.color.map((v) => Math.round(Math.min(1, v) * 255)).join(',') + ')';
    el.classList.toggle('selected', item.selected);
    host.appendChild(el);   // re-appending keeps the DOM order equal to the paint order
  }
  labelItems = items;
}

function shorten(item) {   // label text of an object: its description without the article, cut short
  if (!item.full) return '物体 O' + item.cid;
  const s = item.full.replace(/^(a|an|the)\s+/i, '');
  return s.length > 30 ? s.slice(0, 29) + '…' : s;
}

const entityKey = (kind, id) => kind + ':' + id;
const catalog = D.catalog || { objects: [], places: [] };
const descriptionSources = D.description_sources || {};
const descriptionFrames = D.description_frames || {};
const rgb = (color) => 'rgb(' + color.map((v) => Math.round(Math.min(1, v) * 255)).join(',') + ')';

function objectAt(id) {
  if (!S.snap) return null;
  const i = Array.from(S.snap.obj_cid).findIndex((value) => value === id);
  if (i < 0) return null;
  const mn = row(S.snap.obj_min, i), mx = row(S.snap.obj_max, i), label = S.snap.obj_label[i];
  return { kind: 'object', id, cid: id, index: i, label, mn, mx, color: hue(label), full: D.labels[String(label)] || '',
           center: [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2] };
}

function placeAt(id) {
  if (!S.snap) return null;
  const ids = S.snap.place_cid || new Int32Array(S.snap.place_rad.length).map((_, i) => i);
  const i = Array.from(ids).findIndex((value) => value === id);
  return i < 0 ? null : { kind: 'place', id, cid: id, index: i, center: row(S.snap.place_pos, i), radius: S.snap.place_rad[i], color: [0.3, 0.9, 0.5] };
}

function refreshEntityItems() {
  if (!S.snap) { S.objItems = []; S.placeItems = []; return; }
  S.objItems = Array.from(S.snap.obj_cid, (id) => objectAt(id));
  const placeIds = S.snap.place_cid || new Int32Array(S.snap.place_rad.length).map((_, i) => i);
  S.placeItems = Array.from(placeIds, (id) => placeAt(id));
  for (const item of [...S.objItems, ...S.placeItems]) item.hidden = S.hidden.has(entityKey(item.kind, item.id));
}

function catalogItem(kind, id) {
  const items = kind === 'object' ? catalog.objects : catalog.places;
  return items.find((item) => item.id === id) || null;
}

function showEntityDetail() {
  const host = $('entity-detail');
  host.replaceChildren();
  if (!S.selectedKey) { const empty = document.createElement('span'); empty.className = 'entity-empty'; empty.textContent = '选择一个物体或地点查看详情'; host.appendChild(empty); return; }
  const [kind, rawId] = S.selectedKey.split(':'), id = Number(rawId), history = catalogItem(kind, id);
  const current = kind === 'object' ? objectAt(id) : placeAt(id);
  const title = document.createElement('div'); title.className = 'detail-title';
  title.textContent = (kind === 'object' ? '物体 O' : '地点 p') + id;
  const description = document.createElement('div'); description.className = 'detail-description';
  if (kind === 'object') description.textContent = (current && current.full) || (history && D.labels[String(history.label)]) || '(没有 DAM 文本描述)';
  else description.textContent = current ? '当前地点节点' : '这个地点在当前时刻尚未进入场景图';
  const meta = document.createElement('div'); meta.className = 'detail-meta';
  const lines = [];
  if (current && kind === 'object') {
    const dim = [0, 1, 2].map((k) => (current.mx[k] - current.mn[k]).toFixed(2)).join(' × ');
    lines.push('语义标签 ' + current.label, '尺寸 ' + dim + ' m', '中心 (' + current.center.map((v) => v.toFixed(2)).join(', ') + ')');
  } else if (current) {
    lines.push('半径 ' + current.radius.toFixed(2) + ' m', '位置 (' + current.center.map((v) => v.toFixed(2)).join(', ') + ')');
  }
  if (history) {
    lines.push('首次 ' + history.first.toFixed(1) + ' s · 末次 ' + history.last.toFixed(1) + ' s · 出现于 ' + history.count + ' 个快照');
    if (kind === 'object') lines.push('中心首末位移 ' + history.motion.toFixed(2) + ' m');
  }
  const source = kind === 'object' && history ? descriptionSources[String(history.label)] : null;
  if (source) lines.push('描述来源 frame ' + source.frame_id + (source.timestamp == null ? '' : ' · ' + source.timestamp.toFixed(3) + ' s'));
  lines.push(current ? '当前快照中可见' : '当前快照中未出现', S.hidden.has(S.selectedKey) ? '已手动隐藏' : '正在显示');
  meta.textContent = lines.join('\n');
  host.append(title, description, meta);
}

function openDescriptionSource(item, source) {
  const rgb = source && descriptionFrames[String(source.frame_id)];
  if (!rgb) return;
  $('description-source-caption').textContent = '物体 O' + item.id + ' · 描述来源 frame ' + source.frame_id
    + (source.timestamp == null ? '' : ' · ' + source.timestamp.toFixed(3) + ' s');
  $('description-source-image').src = 'data:image/jpeg;base64,' + rgb;
  $('description-source-modal').classList.add('open');
}

function closeDescriptionSource() {
  $('description-source-modal').classList.remove('open');
  $('description-source-image').removeAttribute('src');
}

function renderEntityBrowser() {
  const isObject = S.entityTab === 'objects', items = isObject ? catalog.objects : catalog.places;
  $('entity-tab-objects').classList.toggle('active', isObject);
  $('entity-tab-places').classList.toggle('active', !isObject);
  const query = $('entity-filter').value.trim().toLowerCase();
  const filtered = items.filter((item) => {
    const name = isObject ? (D.labels[String(item.label)] || '') : '';
    return !query || String(item.id).includes(query) || name.toLowerCase().includes(query);
  });
  $('entity-count').textContent = filtered.length + ' / ' + items.length;
  const list = $('entity-list'), scroll = list.scrollTop;
  list.replaceChildren();
  if (!filtered.length) { const empty = document.createElement('div'); empty.className = 'entity-empty'; empty.textContent = '没有匹配的实体'; list.appendChild(empty); }
  for (const item of filtered) {
    const kind = isObject ? 'object' : 'place', key = entityKey(kind, item.id), current = isObject ? objectAt(item.id) : placeAt(item.id);
    const rowEl = document.createElement('div'); rowEl.className = 'entity-row'; rowEl.dataset.entityKey = key;
    rowEl.classList.toggle('active', S.selectedKey === key); rowEl.classList.toggle('absent', !current); rowEl.classList.toggle('hidden', S.hidden.has(key));
    const dot = document.createElement('span'); dot.className = 'entity-dot'; dot.style.background = rgb(isObject ? hue(item.label) : [0.3, 0.9, 0.5]);
    const copy = document.createElement('div'); copy.className = 'entity-copy';
    const name = document.createElement('div'); name.className = 'entity-name';
    name.textContent = (isObject ? 'O' : 'p') + item.id + (isObject && D.labels[String(item.label)] ? ' · ' + D.labels[String(item.label)] : '');
    const meta = document.createElement('div'); meta.className = 'entity-meta';
    meta.textContent = (current ? '当前可见' : '当前未出现') + ' · ' + item.count + ' 个快照';
    copy.append(name, meta);
    const eye = document.createElement('button'); eye.type = 'button'; eye.className = 'entity-eye';
    eye.textContent = S.hidden.has(key) ? '◌' : '◉'; eye.title = S.hidden.has(key) ? '显示这个实体' : '隐藏这个实体';
    eye.onclick = (event) => { event.stopPropagation(); if (S.hidden.has(key)) S.hidden.delete(key); else S.hidden.add(key); S.dirty = true; renderEntityBrowser(); requestDraw(); };
	const source = isObject ? descriptionSources[String(item.label)] : null;
	const sourceButton = document.createElement('button'); sourceButton.type = 'button'; sourceButton.className = 'entity-source';
	const sourceRgb = source && descriptionFrames[String(source.frame_id)];
	sourceButton.textContent = '源帧'; sourceButton.disabled = !sourceRgb;
	sourceButton.title = sourceRgb ? '打开 DAM 描述所用的 frame ' + source.frame_id : '没有可用的 DAM 描述来源图像';
	sourceButton.onclick = (event) => { event.stopPropagation(); openDescriptionSource(item, source); };
    rowEl.onclick = () => selectEntity(kind, item.id);
	rowEl.append(dot, copy);
	if (isObject) rowEl.append(sourceButton);
	rowEl.append(eye); list.appendChild(rowEl);
  }
  list.scrollTop = scroll;
  showEntityDetail();
}

function revealEntityRow(key) {
  const list = $('entity-list');
  let rowEl = list.querySelector('[data-entity-key="' + key + '"]');
  if (!rowEl && $('entity-filter').value) {
    $('entity-filter').value = '';
    renderEntityBrowser();
    rowEl = list.querySelector('[data-entity-key="' + key + '"]');
  }
  if (rowEl) rowEl.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'nearest' });
}

function selectEntity(kind, id, revealInList = false) {
  const key = entityKey(kind, id);
  S.selectedKey = key;
  if (revealInList) S.entityTab = kind === 'object' ? 'objects' : 'places';
  S.dirty = true; renderEntityBrowser(); requestDraw();
  if (revealInList) revealEntityRow(key);
}

function assemble() {   // everything except the mesh: boxes, graph nodes and edges, trajectory
  const a = S.snap, sp = parseFloat(ui('r-space').value), nodeScale = parseFloat(ui('r-size').value);
  const L = [], LC = [], P = [], PC = [], PS = [], HP = [], HPC = [], HPS = [];
  const line = (p, r, c) => { L.push(p[0], p[1], p[2], r[0], r[1], r[2]); LC.push(c[0], c[1], c[2], c[0], c[1], c[2]); };
  const node = (p, c, s) => { P.push(p[0], p[1], p[2]); PC.push(c[0], c[1], c[2]); PS.push(s * nodeScale); };
  const highlightNode = (p, s) => { HP.push(p[0], p[1], p[2]); HPC.push(AMBER_RGB[0], AMBER_RGB[1], AMBER_RGB[2]); HPS.push(s * nodeScale); };   // the selection: amber, an x-ray overlay
  const lift = (p, k) => [p[0], p[1], p[2] + k * sp];
  const labels = [], labelMode = ui('label-mode').value;   // selected | all | none
  const wantLabel = (picked) => labelMode === 'all' || (labelMode === 'selected' && picked);
  const nObj = a.obj_cid.length, nPl = a.place_rad.length, nRoom = a.room_pos.length / 3, nBld = a.bld_pos.length / 3, nAg = a.agent_pos.length / 3;

  S.objItems = [];   // every object of this snapshot, for labels and picking
  for (let i = 0; i < nObj; i++) {
    const mn = row(a.obj_min, i), mx = row(a.obj_max, i), cid = a.obj_cid[i], color = hue(a.obj_label[i]);
    const item = { kind: 'object', id: cid, cid, index: i, label: a.obj_label[i], mn, mx, color, full: D.labels[String(a.obj_label[i])] || '',
                   center: [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2] };
    S.objItems.push(item);
    const key = entityKey('object', cid), hidden = S.hidden.has(key), picked = key === S.selectedKey;
    item.hidden = hidden;
    if (hidden) continue;
    if (ui('c-obj').checked) {
      if (picked) highlightNode(item.center, 0.085); else node(item.center, color, 0.035);
    }
    const boxMode = ui('bbox-mode').value, showBox = boxMode === 'all' || (boxMode === 'selected' && picked);
    const big = Math.hypot(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]) > 1.5;
    const c = big && !picked ? color.map((v) => v * 0.5) : color;   // floor, desk and walls are dimmed
    if (showBox) {   // the ordinary 3D box; the selected box is also drawn by the screen-space overlay (drawSelectedBoxOverlay)
      const corners = [];
      for (let k = 0; k < 8; k++) corners.push([(k & 1) ? mx[0] : mn[0], (k & 2) ? mx[1] : mn[1], (k & 4) ? mx[2] : mn[2]]);
      for (const [u, v] of BOX_EDGES) line(corners[u], corners[v], c);
    }
    if (wantLabel(picked)) labels.push({ key: entityKey('object', cid), pos: [item.center[0], item.center[1], mx[2] + 0.02], text: shorten(item), color, selected: picked });
  }
  const placeIds = a.place_cid || new Int32Array(nPl).map((_, i) => i);
  S.placeItems = [];
  for (let i = 0; i < nPl; i++) {
    const cid = placeIds[i], key = entityKey('place', cid), picked = key === S.selectedKey;
    const item = { kind: 'place', id: cid, cid, index: i, center: row(a.place_pos, i), radius: a.place_rad[i], color: [0.3, 0.9, 0.5], hidden: S.hidden.has(key) };
    S.placeItems.push(item);
    if (item.hidden || !ui('c-places').checked) continue;
    if (picked) highlightNode(lift(item.center, 1), 0.075); else node(lift(item.center, 1), item.color, 0.035);
    if (wantLabel(picked)) labels.push({ key: entityKey('place', cid), pos: lift(item.center, 1), text: '地点 p' + cid, color: item.color, selected: picked });
  }
  if (ui('c-pedges').checked) for (let e = 0; e < a.place_edges.length; e += 2) {
    const u = a.place_edges[e], v = a.place_edges[e + 1];
    if (!S.hidden.has(entityKey('place', placeIds[u])) && !S.hidden.has(entityKey('place', placeIds[v])))
      line(lift(row(a.place_pos, u), 1), lift(row(a.place_pos, v), 1), [0.2, 0.62, 0.38]);
  }
  if (ui('c-rooms').checked) {
    for (let i = 0; i < nRoom; i++) {
      node(lift(row(a.room_pos, i), 2), [1.0, 0.62, 0.2], 0.09);
      if (labelMode === 'all') labels.push({ key: 'room:' + i, pos: lift(row(a.room_pos, i), 2), text: '房间 R' + i, color: [1.0, 0.62, 0.2], selected: false });
    }
    for (let i = 0; i < nBld; i++) {
      node(lift(row(a.bld_pos, i), 3), [1.0, 0.9, 0.3], 0.11);
      if (labelMode === 'all') labels.push({ key: 'building:' + i, pos: lift(row(a.bld_pos, i), 3), text: '楼宇', color: [1.0, 0.9, 0.3], selected: false });
    }
  }
  if (ui('c-links').checked) {
    const grey = [0.46, 0.5, 0.58];
    for (let e = 0; e < a.room_place_edges.length; e += 2) {
      const p = a.room_place_edges[e + 1];
      if (!S.hidden.has(entityKey('place', placeIds[p]))) line(lift(row(a.room_pos, a.room_place_edges[e]), 2), lift(row(a.place_pos, p), 1), grey);
    }
    for (let e = 0; e < a.bld_room_edges.length; e += 2)
      line(lift(row(a.bld_pos, a.bld_room_edges[e]), 3), lift(row(a.room_pos, a.bld_room_edges[e + 1]), 2), grey);
    for (let e = 0; e < a.obj_place_edges.length; e += 2) {
      const p = a.obj_place_edges[e], o = a.obj_place_edges[e + 1], mn = row(a.obj_min, o), mx = row(a.obj_max, o);
      if (!S.hidden.has(entityKey('place', placeIds[p])) && !S.hidden.has(entityKey('object', a.obj_cid[o])))
        line(lift(row(a.place_pos, p), 1), [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2], grey);
    }
  }
  if (ui('c-traj').checked && nAg) {
    const blue = [0.35, 0.8, 1.0];
    for (let i = 0; i < nAg; i++) {
      node(row(a.agent_pos, i), blue, 0.02);
      if (i) line(row(a.agent_pos, i - 1), row(a.agent_pos, i), blue);
    }
    const p = row(a.agent_pos, nAg - 1), axes = quatAxes(Array.from(a.agent_quat.slice(4 * (nAg - 1), 4 * nAg))), len = radius * 0.12;
    const colors = [[1, 0.3, 0.3], [0.4, 1, 0.4], [0.4, 0.6, 1]];
    for (let k = 0; k < 3; k++) line(p, [p[0] + axes[k][0] * len, p[1] + axes[k][1] * len, p[2] + axes[k][2] * len], colors[k]);
  }
  upload(B.lPos, gl.ARRAY_BUFFER, new Float32Array(L)); upload(B.lCol, gl.ARRAY_BUFFER, new Float32Array(LC));
  upload(B.nPos, gl.ARRAY_BUFFER, new Float32Array(P)); upload(B.nCol, gl.ARRAY_BUFFER, new Float32Array(PC));
  upload(B.nSize, gl.ARRAY_BUFFER, new Float32Array(PS));
  upload(B.hNPos, gl.ARRAY_BUFFER, new Float32Array(HP)); upload(B.hNCol, gl.ARRAY_BUFFER, new Float32Array(HPC));
  upload(B.hNSize, gl.ARRAY_BUFFER, new Float32Array(HPS));
  G.lines = L.length / 3; G.nodes = PS.length; G.highlightNodes = HPS.length;
  setLabelItems(labels);
  showEntityDetail();
}

function activeMesh() {   // the arrays of the selected mesh source, and the key that says which arrays they are
  const mode = ui('mesh-mode').value;
  if (mode === 'reference' && S.reference) return { key: 'reference', mesh: S.reference };
  if (mode === 'dynamic' && S.snap) {
    const a = S.snap;
    return { key: 'dynamic:' + S.cur, mesh: { pos: a.pos, nrm: a.nrm, col: a.mesh_col, idx: a.mesh_faces, count: a.pos.length / 3, tris: a.mesh_faces.length / 3 } };
  }
  return { key: 'none', mesh: null };
}

function uploadMesh() {   // skipped while the buffers already hold the arrays of the active source: the static mesh is uploaded once
  const { key, mesh } = activeMesh();
  if (key === G.meshKey) return;
  G.meshKey = key;
  if (!mesh) { G.meshCount = 0; G.meshTriangles = 0; G.meshIndexed = 0; return; }
  G.meshUploads++;
  upload(B.mPos, gl.ARRAY_BUFFER, mesh.pos); upload(B.mCol, gl.ARRAY_BUFFER, mesh.col); upload(B.mNrm, gl.ARRAY_BUFFER, mesh.nrm);
  upload(B.mIdx, gl.ELEMENT_ARRAY_BUFFER, mesh.idx);
  G.meshCount = mesh.count; G.meshTriangles = mesh.tris; G.meshIndexed = mesh.idx.length;
  G.indexType = mesh.idx instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
  if (mesh.idx instanceof Uint32Array && !UINT_INDEX_OK) G.meshIndexed = 0;   // no 32-bit indices here: draw the vertices as points
}

function updateMeshStatus() {
  const mode = ui('mesh-mode').value, active = activeMesh().mesh;
  let text = '网格已隐藏。';
  if (mode === 'reference' && S.reference)
    text = REF.label + '(' + fmt(S.reference.count) + ' 顶点 · ' + fmt(S.reference.tris) + ' 三角形):用整段序列的 RGB-D 帧和位姿重建的静态网格,是参考,不是真值,也不是 Hydra 在这一时刻已有的地图。';
  else if (mode === 'dynamic') text = '动态 Hydra 网格:Hydra 在当前快照时已经建好的网格,随时间变化。';
  if (active && active.idx instanceof Uint32Array && !UINT_INDEX_OK) text += ' 这个浏览器不支持 32 位索引,只能画顶点。';
  if (S.referenceError) text += ' 参考网格无法使用(' + S.referenceError + ')。';
  $('mesh-status').textContent = text;
}

// ------------------------------------------------------------------ drawing
let W = 1, H = 1, raf = 0;
function requestDraw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

function draw() {
  const cssW = Math.max(1, canvas.clientWidth), cssH = Math.max(1, canvas.clientHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, Math.sqrt(2.2e6 / (cssW * cssH)));   // render at most ~2.2 megapixels
  const w = Math.max(1, Math.round(cssW * dpr)), h = Math.max(1, Math.round(cssH * dpr));
  if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; }
  W = w; H = h; S.dpr = dpr;
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.082, 0.09, 0.106, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  if (!S.snap) return;
  if (S.dirty) { uploadMesh(); assemble(); S.dirty = false; }

  const cp = Math.cos(S.pitch), eye = [S.target[0] + S.dist * cp * Math.cos(S.yaw), S.target[1] + S.dist * cp * Math.sin(S.yaw), S.target[2] + S.dist * Math.sin(S.pitch)];
  const view = lookAt(eye, S.target, [0, 0, 1]);
  const fovy = 0.8, proj = perspective(fovy, W / H, S.dist * 0.01, S.dist * 40 + radius * 10), mvp = mul(proj, view.m);
  S.eye = eye;
  S.view = { m: view.m, mvp, right: view.right, up: view.up };

  if (G.meshCount) {
    const asPoints = ui('c-points').checked || !G.meshIndexed;
    gl.useProgram(MESH.p);
    attrib(MESH.a.aPos, B.mPos, 3, gl.FLOAT); attrib(MESH.a.aCol, B.mCol, 3, gl.UNSIGNED_BYTE, true); attrib(MESH.a.aNrm, B.mNrm, 3, gl.FLOAT);
    gl.uniformMatrix4fv(MESH.u.uMVP, false, mvp); gl.uniformMatrix4fv(MESH.u.uView, false, view.m);
    gl.uniform1f(MESH.u.uPoint, Math.max(2, 2.5 * S.dpr)); gl.uniform1f(MESH.u.uLit, asPoints ? 0 : 1);
    gl.uniform1f(MESH.u.uGain, ui('c-bright').checked ? 1.8 : 1.0);
    if (asPoints) gl.drawArrays(gl.POINTS, 0, G.meshCount);
    else { gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, B.mIdx); gl.drawElements(gl.TRIANGLES, G.meshIndexed, G.indexType, 0); }
    for (const k of ['aPos', 'aCol', 'aNrm']) gl.disableVertexAttribArray(MESH.a[k]);
  }
  if (G.lines) {
    gl.useProgram(LINES.p);
    attrib(LINES.a.aPos, B.lPos, 3, gl.FLOAT); attrib(LINES.a.aCol, B.lCol, 3, gl.FLOAT);
    gl.uniformMatrix4fv(LINES.u.uMVP, false, mvp);
    gl.drawArrays(gl.LINES, 0, G.lines);
    gl.disableVertexAttribArray(LINES.a.aPos); gl.disableVertexAttribArray(LINES.a.aCol);
  }
  if (G.nodes) {
    gl.useProgram(NODES.p);
    attrib(NODES.a.aPos, B.nPos, 3, gl.FLOAT); attrib(NODES.a.aCol, B.nCol, 3, gl.FLOAT); attrib(NODES.a.aSize, B.nSize, 1, gl.FLOAT);
    gl.uniformMatrix4fv(NODES.u.uMVP, false, mvp); gl.uniform1f(NODES.u.uScale, H / (2 * Math.tan(fovy / 2)));
    gl.drawArrays(gl.POINTS, 0, G.nodes);
    for (const k of ['aPos', 'aCol', 'aSize']) gl.disableVertexAttribArray(NODES.a[k]);
  }
  if (G.highlightNodes) {
    gl.disable(gl.DEPTH_TEST);   // the selected node is an x-ray overlay and stays visible through the mesh
    gl.useProgram(NODES.p);
    attrib(NODES.a.aPos, B.hNPos, 3, gl.FLOAT); attrib(NODES.a.aCol, B.hNCol, 3, gl.FLOAT); attrib(NODES.a.aSize, B.hNSize, 1, gl.FLOAT);
    gl.uniformMatrix4fv(NODES.u.uMVP, false, mvp); gl.uniform1f(NODES.u.uScale, H / (2 * Math.tan(fovy / 2)));
    gl.drawArrays(gl.POINTS, 0, G.highlightNodes);
    for (const k of ['aPos', 'aCol', 'aSize']) gl.disableVertexAttribArray(NODES.a[k]);
    gl.enable(gl.DEPTH_TEST);
  }
  positionLabels();
  drawSelectedBoxOverlay();
}

function project(p) {   // world point -> [x, y, depth] in CSS pixels, or null behind the camera
  const m = S.view.mvp, cw = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
  if (cw <= 0.001) return null;
  const x = (m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12]) / cw, y = (m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13]) / cw;
  return [(x * 0.5 + 0.5) * canvas.clientWidth, (0.5 - y * 0.5) * canvas.clientHeight, cw];
}

function clipPoint(p) {
  const m = S.view.mvp;
  return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12],
          m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13],
          m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14],
          m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15]];
}

const CLIP_PLANES = [
  (p) => p[3] + p[0], (p) => p[3] - p[0], (p) => p[3] + p[1],
  (p) => p[3] - p[1], (p) => p[3] + p[2], (p) => p[3] - p[2],
];
function clipPolygon(vertices) {
  let polygon = vertices.map((point) => point.slice());
  for (const plane of CLIP_PLANES) {
    if (!polygon.length) break;
    const clipped = [];
    let previous = polygon[polygon.length - 1], previousDistance = plane(previous);
    for (const current of polygon) {
      const currentDistance = plane(current);
      if (currentDistance >= 0) {
        if (previousDistance < 0) {
          const t = previousDistance / (previousDistance - currentDistance);
          clipped.push(previous.map((value, i) => value + (current[i] - value) * t));
        }
        clipped.push(current);
      } else if (previousDistance >= 0) {
        const t = previousDistance / (previousDistance - currentDistance);
        clipped.push(previous.map((value, i) => value + (current[i] - value) * t));
      }
      previous = current; previousDistance = currentDistance;
    }
    polygon = clipped;
  }
  return polygon;
}

function convexHull(points) {
  const unique = [];
  for (const point of points.sort((a, b) => a[0] - b[0] || a[1] - b[1]))
    if (!unique.length || Math.hypot(point[0] - unique[unique.length - 1][0], point[1] - unique[unique.length - 1][1]) > 0.01) unique.push(point);
  if (unique.length < 3) return unique;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const point of unique) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0) lower.pop(); lower.push(point); }
  for (let i = unique.length - 1; i >= 0; i--) { const point = unique[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0) upper.pop(); upper.push(point); }
  lower.pop(); upper.pop(); return lower.concat(upper);
}

function polygonArea(polygon) {
  let twice = 0;
  for (let i = 0; i < polygon.length; i++) { const a = polygon[i], b = polygon[(i + 1) % polygon.length]; twice += a[0] * b[1] - a[1] * b[0]; }
  return Math.abs(twice) / 2;
}

function pointInPolygon(polygon, x, y) {
  let sign = 0;
  for (let i = 0; i < polygon.length; i++) {
    const a = polygon[i], b = polygon[(i + 1) % polygon.length], cross = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
    if (Math.abs(cross) < 0.01) continue;
    if (sign && Math.sign(cross) !== sign) return false;
    sign = Math.sign(cross);
  }
  return true;
}

function projectBox(item) {
  if (!S.view) return null;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const insideEpsilon = 1e-7;
  if (S.eye && S.eye.every((value, axis) => value > item.mn[axis] + insideEpsilon && value < item.mx[axis] - insideEpsilon))
    return { polygon: [[0, 0], [cw, 0], [cw, ch], [0, ch]], area: cw * ch, depth: 0 };
  const world = [];
  for (let k = 0; k < 8; k++) world.push([(k & 1) ? item.mx[0] : item.mn[0], (k & 2) ? item.mx[1] : item.mn[1], (k & 4) ? item.mx[2] : item.mn[2]]);
  const clip = world.map(clipPoint), visible = [], depths = [];
  const faces = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]];
  for (const face of faces) {
    for (const p of clipPolygon(face.map((index) => clip[index]))) {
      const x = Math.max(0, Math.min(cw, (p[0] / p[3] * 0.5 + 0.5) * cw));
      const y = Math.max(0, Math.min(ch, (0.5 - p[1] / p[3] * 0.5) * ch));
      visible.push([x, y]); depths.push(p[3]);
    }
  }
  const polygon = convexHull(visible);
  return polygon.length >= 3 ? { polygon, area: polygonArea(polygon), depth: Math.min(...depths.filter((value) => value > 0)) } : null;
}
function positionLabels() {   // every draw: only the screen position of each card; a card is hidden only when its own anchor is off screen
  const cw = canvas.clientWidth, chh = canvas.clientHeight;
  for (const item of labelItems) {
    const el = labelEls.get(item.key), s = project(item.pos);
    if (!el) continue;
    const onScreen = !!s && s[0] >= 0 && s[0] <= cw && s[1] >= 0 && s[1] <= chh;   // project() is null behind the camera
    el.style.display = onScreen ? 'block' : 'none';
    if (onScreen) el.style.transform = 'translate(' + Math.round(s[0] - 8) + 'px,' + Math.round(s[1] - 22) + 'px)';
  }
}

// The selected box is drawn on a 2D canvas above the WebGL one: depth-independent, vivid amber on a dark halo, with corner
// dots, so neither the mesh shading nor a browser's WebGL line-width limit can make it look like an ordinary thin edge.
const overlay = $('selection-overlay'), octx = overlay.getContext('2d');

function selectedBoxItem() {   // the selected object, when this snapshot has it and its eye is not closed
  if (!S.selectedKey || !S.selectedKey.startsWith('object:')) return null;
  const item = (S.objItems || []).find((it) => entityKey('object', it.id) === S.selectedKey);
  return item && !item.hidden ? item : null;
}

function clipSegment(a, b) {   // Liang-Barsky in clip space: the part of the segment inside the six frustum planes, or null
  let t0 = 0, t1 = 1;
  for (const plane of CLIP_PLANES) {
    const da = plane(a), db = plane(b);
    if (da < 0 && db < 0) return null;
    if (da < 0) t0 = Math.max(t0, da / (da - db));
    else if (db < 0) t1 = Math.min(t1, da / (da - db));
    if (t0 > t1) return null;
  }
  const at = (t) => a.map((value, i) => value + (b[i] - value) * t);
  return [at(t0), at(t1)];
}

function drawSelectedBoxOverlay() {
  const cw = canvas.clientWidth, chh = canvas.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(cw * dpr)), h = Math.max(1, Math.round(chh * dpr));
  if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  octx.clearRect(0, 0, cw, chh);
  G.overlay = { visible: false, segments: 0, corners: 0, haloWidth: 10, lineWidth: 4, color: AMBER };
  const item = selectedBoxItem();
  if (!item || !S.view) return;
  const clip = [];
  for (let k = 0; k < 8; k++) clip.push(clipPoint([(k & 1) ? item.mx[0] : item.mn[0], (k & 2) ? item.mx[1] : item.mn[1], (k & 4) ? item.mx[2] : item.mn[2]]));
  const px = (p) => [(p[0] / p[3] * 0.5 + 0.5) * cw, (0.5 - p[1] / p[3] * 0.5) * chh];
  const segments = [];
  for (const [u, v] of BOX_EDGES) { const s = clipSegment(clip[u], clip[v]); if (s) segments.push([px(s[0]), px(s[1])]); }
  const corners = clip.filter((p) => CLIP_PLANES.every((plane) => plane(p) >= 0)).map(px);
  octx.lineCap = 'round'; octx.lineJoin = 'round';
  for (const [width, color] of [[G.overlay.haloWidth, HALO], [G.overlay.lineWidth, AMBER]]) {
    octx.lineWidth = width; octx.strokeStyle = color; octx.beginPath();
    for (const [p, q] of segments) { octx.moveTo(p[0], p[1]); octx.lineTo(q[0], q[1]); }
    octx.stroke();
  }
  octx.lineWidth = 2; octx.strokeStyle = HALO; octx.fillStyle = AMBER;
  for (const [x, y] of corners) { octx.beginPath(); octx.arc(x, y, 5, 0, 2 * Math.PI); octx.fill(); octx.stroke(); }
  G.overlay.segments = segments.length; G.overlay.corners = corners.length; G.overlay.visible = segments.length > 0;
}

function pick(clientX, clientY) {   // select inside the clipped visible bbox polygon; smaller and then nearer overlaps win
  const r = canvas.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
  const hits = [];
  for (const it of S.objItems || []) {
    if (it.hidden) continue;
    const projected = projectBox(it);
    if (projected && pointInPolygon(projected.polygon, x, y)) hits.push({ item: it, area: projected.area, depth: projected.depth });
  }
  hits.sort((a, b) => a.area - b.area || a.depth - b.depth);
  if (hits.length) { selectEntity('object', hits[0].item.cid, true); return; }
  let bestPlace = null, bestDistance = 22;
  const sp = parseFloat(ui('r-space').value);
  for (const it of S.placeItems || []) {
    if (it.hidden) continue;
    const s = project([it.center[0], it.center[1], it.center[2] + sp]);
    const distance = s ? Math.hypot(s[0] - x, s[1] - y) : Infinity;
    if (distance < bestDistance) { bestDistance = distance; bestPlace = it; }
  }
  if (bestPlace) selectEntity('place', bestPlace.cid, true);
  else { S.selectedKey = null; S.dirty = true; renderEntityBrowser(); requestDraw(); }
}

// ------------------------------------------------------------------ time slider and playback
const slider = $('slider'), info = $('info');
slider.max = N - 1;
const fmt = (n) => n.toLocaleString('en-US');

function updateInfo() {   // the status line: time, snapshot, entity counts and the vertex count of the mesh on screen
  const a = S.snap;
  if (!a) return;
  const mesh = activeMesh().mesh;
  info.textContent = 't = ' + D.snapshots[S.cur].t.toFixed(1) + ' s  ·  ' + (S.cur + 1) + ' / ' + N + '  ·  物体 ' + a.obj_cid.length + '  ·  地点 ' + a.place_rad.length
    + '  ·  房间 ' + a.room_pos.length / 3 + '  ·  顶点 ' + fmt(mesh ? mesh.count : 0);
}

function showImages(i) {   // the RGB and depth image of the frame the pipeline had processed at this moment
  const f = D.frames;
  if (!f) return;
  $('img-rgb').src = 'data:image/jpeg;base64,' + f.rgb[i];
  $('img-depth').src = 'data:image/jpeg;base64,' + f.depth[i];
  $('cap-rgb').textContent = 'RGB · 帧 ' + (f.index[i] + 1) + ' / ' + f.count;
  $('cap-depth').textContent = '深度 · 蓝近红远(0–' + f.max_depth + ' m),黑色没测到';
  $('cam').style.display = $('c-cam').checked ? 'flex' : 'none';
}

async function show(i) {
  i = Math.max(0, Math.min(N - 1, i));
  S.wanted = i; slider.value = i;
  const mine = ++S.request;
  const a = await snapshot(i);
  if (mine !== S.request) return;   // a newer request overtook this one
  S.cur = i; S.snap = a; S.dirty = true;
  refreshEntityItems();   // picking must immediately use this snapshot, before the next animation frame assembles GL buffers
  showImages(i);
  updateInfo(); updateMeshStatus();
  renderEntityBrowser();
  requestDraw();
  for (let k = 1; k <= 3 && i + k < N; k++) snapshot(i + k);   // warm the cache for playback
}

let playing = false, timer = 0, playbackStartIndex = 0, playbackStartedAt = 0;
function playbackTick() {
  if (!playing) return;
  const speed = parseFloat($('speed').value);
  const targetTime = D.snapshots[playbackStartIndex].t + (performance.now() - playbackStartedAt) / 1000 * speed;
  let next = S.wanted;
  while (next + 1 < N && D.snapshots[next + 1].t <= targetTime + 1e-6) next++;
  if (next !== S.wanted) show(next);
  if (next >= N - 1) { setPlaying(false); return; }
  const delay = Math.max(0, (D.snapshots[next + 1].t - targetTime) * 1000 / speed);
  timer = setTimeout(playbackTick, delay);
}
function setPlaying(on) {
  playing = on; $('play').textContent = on ? '⏸' : '▶';
  clearTimeout(timer);
  if (on) {
    if (S.wanted >= N - 1) show(0);
    playbackStartIndex = S.wanted;
    playbackStartedAt = performance.now();
    playbackTick();
  }
}
$('play').onclick = () => setPlaying(!playing);
$('first').onclick = () => { setPlaying(false); show(0); };
$('prev').onclick = () => { setPlaying(false); show(S.wanted - 1); };
$('next').onclick = () => { setPlaying(false); show(S.wanted + 1); };
$('speed').onchange = () => { if (playing) setPlaying(true); };
slider.oninput = () => show(parseInt(slider.value, 10));
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('description-source-modal').classList.contains('open')) { closeDescriptionSource(); return; }
  if ($('description-source-modal').classList.contains('open')) return;
  if (e.target && e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); show(S.wanted - 1); }
  else if (e.key === 'ArrowRight') { setPlaying(false); show(S.wanted + 1); }
  else if (e.key === 'Home') { setPlaying(false); show(0); }
  else if (e.key === 'End') { setPlaying(false); show(N - 1); }
});

// ------------------------------------------------------------------ view controls
for (const id of ['mesh-mode', 'c-bright', 'c-points', 'c-obj', 'bbox-mode', 'label-mode', 'c-places', 'c-pedges', 'c-rooms', 'c-links', 'c-traj', 'r-size', 'r-space'])
  $(id).addEventListener('input', () => { $('v-space').textContent = parseFloat($('r-space').value).toFixed(1) + ' m'; S.dirty = true; requestDraw(); });
$('mesh-mode').addEventListener('input', () => { updateMeshStatus(); updateInfo(); });
$('entity-tab-objects').onclick = () => { S.entityTab = 'objects'; renderEntityBrowser(); };
$('entity-tab-places').onclick = () => { S.entityTab = 'places'; renderEntityBrowser(); };
$('entity-filter').addEventListener('input', renderEntityBrowser);
$('description-source-close').onclick = closeDescriptionSource;
$('description-source-modal').onclick = (event) => { if (event.target === $('description-source-modal')) closeDescriptionSource(); };
$('c-cam').addEventListener('input', () => { $('cam').style.display = D.frames && $('c-cam').checked ? 'flex' : 'none'; });
$('cam').addEventListener('click', () => $('cam').classList.toggle('big'));
let drag = null;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); canvas.focus(); drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, moved: 0, pan: e.button === 2 || e.button === 1 || e.shiftKey }; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0));
  if (drag.pan && S.view) {
    const k = S.dist * 0.0016;
    for (let i = 0; i < 3; i++) S.target[i] += (-S.view.right[i] * dx + S.view.up[i] * dy) * k;
  } else {
    S.yaw -= dx * 0.006; S.pitch = Math.max(-1.5, Math.min(1.5, S.pitch + dy * 0.006));
  }
  requestDraw();
});
canvas.addEventListener('pointerup', (e) => { if (drag && drag.moved < 4 && e.button === 0 && !e.shiftKey) pick(e.clientX, e.clientY); drag = null; });
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); S.dist = Math.max(radius * 0.05, Math.min(radius * 40, S.dist * Math.exp(e.deltaY * 0.0012))); requestDraw(); }, { passive: false });
canvas.addEventListener('dblclick', () => { if (S.snap) fitView(); resetView(); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('resize', requestDraw);

resetView();
async function start() {
  if (REF) {
    try { S.reference = await decodeReference(); }
    catch (e) { S.reference = null; S.referenceError = e.message; }
  }
  if (!S.reference) {   // no reference payload (or it cannot be decoded): the dynamic Hydra mesh is the only mesh there is
    const option = ui('mesh-mode').querySelector('option[value="reference"]');
    if (option) option.remove();
    ui('mesh-mode').value = 'dynamic';
  }
  await show(N - 1);
  slider.value = N - 1; fitView(); resetView();
}
start().catch((e) => fail('出错了:' + e.message));
window.replayDebug = { S, G, D, draw, show, resetView, fitView, project, projectBox, pick, selectEntity, activeMesh, positionLabels, drawSelectedBoxOverlay, labels: () => labelItems };   // handles for debugging in the browser console
})();
</script>
</body>
